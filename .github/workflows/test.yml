name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node scripts/check-html-js.mjs index.html
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: node scripts/check-coverage.mjs
      - name: Fail if any test can silently skip
        run: |
          if grep -rE '\btest\.(skip|fixme)\(' e2e/; then
            echo "::error::A test.skip()/test.fixme() was added — a skipped test is a failing test. Remove it, or make this CI step assert explicitly around the skip condition." >&2
            exit 1
          fi
      - name: Defect density report
        run: scripts/defect-density.sh
      - name: Defect density gate (release only)
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/defect-density.sh --enforce
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
